<html lang="en-US">

    <!-- Google Tag Manager (noscript) -->

    <!-- End Google Tag Manager (noscript) -->
    {{- partial "header.html" . -}}
    <main id="main-content" tabindex="-1">
        {{ if not .IsHome }}{{- partial "breadcrumbs.html" . -}}{{ end }}
        {{ block "main" . }}{{ end }}

    {{- partial "footer.html" . -}}

</html>
